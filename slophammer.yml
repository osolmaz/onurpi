typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - packages
    exclude:
      - "**/*.test.ts"
      - pattern: "**/eslint.config.mjs"
        reason: Independent packages keep self-contained lint configuration for standalone checks.
      - pattern: "**/test/support.ts"
        reason:
          Ported pi-extensions monorepo test harness; each vendored package keeps an independent
          copy.
      - pattern: "packages/pi-tui-kit/test/**"
        reason:
          Ported upstream test fixtures kept close to the node:test originals for regraft fidelity.
      - pattern: "packages/pi-usage/test/**"
        reason:
          Ported upstream test fixtures kept close to the node:test originals for regraft fidelity.
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - packages/agents/scripts/atomic-directory.ts
      - packages/agents/scripts/sync-skills.ts
      - packages/agents/scripts/sync-simpledoc-skill.ts
      - packages/turn-fold/compaction-visibility.ts
      - packages/turn-fold/configuration.ts
      - packages/turn-fold/fold-policy.ts
      - packages/turn-fold/history-entry.ts
      - packages/turn-fold/history-index.ts
      - packages/turn-fold/history-input.ts
      - packages/turn-fold/history-navigation.ts
      - packages/turn-fold/history-renderer.ts
      - packages/turn-fold/history-scope.ts
      - packages/turn-fold/history-search.ts
      - packages/turn-fold/history-viewport.ts
      - packages/turn-fold/projection-plan.ts
      - packages/turn-fold/restart-marker.ts
      - packages/turn-fold/transcript-window-adapter.ts
      - packages/turn-fold/transcript-windows.ts
      - packages/turn-fold/tool-padding.ts
      - packages/turn-fold/turn-visibility.ts
      - packages/live-stats/live-stats.ts
      - packages/skill-slug/index.ts
      - packages/nyan-mode/src/png.ts
      - packages/nyan-mode/src/progress.ts
      - packages/prompt-queue/queue-model.ts
      - packages/prompt-queue/history-model.ts
      - packages/prompt-queue/delivery-policy.ts
      - packages/prompt-queue/submit-policy.ts
      - packages/prompt-queue/message-text.ts
      - packages/prompt-queue/widget-lines.ts
      - packages/prompt-queue/window-state.ts
      - packages/codex-switcher/codex-family.ts
      - packages/codex-switcher/config.ts
      - packages/codex-switcher/native-provider.ts
      - packages/codex-switcher/router.ts
      - packages/codex-switcher/usage-client.ts
      - packages/codex-switcher/usage-policy.ts
      - packages/pi-codex-compaction/codex-compaction.ts
      - packages/pi-codex-compaction/native-checkpoint.ts
      - packages/pi-codex-compaction/remote-compaction.ts
      - packages/pi-codex-compaction/responses-input.ts
      - packages/pi-usage/src/core.ts
      - packages/pi-usage/src/format.ts
      - packages/pi-usage/src/query.ts
      - packages/pi-tui-kit/src/interaction.ts
      - packages/pi-tui-kit/src/model.ts
      - packages/pi-tui-kit/src/navigator.ts
      - packages/plan-checklist/plan-context.ts
      - packages/plan-checklist/plan-render.ts
      - packages/plan-checklist/plan-replay.ts
      - packages/plan-checklist/plan-schema.ts
      - packages/plan-checklist/plan-state.ts
      - packages/unified-exec/src/completion.ts
      - packages/unified-exec/src/format-time.ts
      - packages/unified-exec/src/head-tail-buffer.ts
      - packages/unified-exec/src/time.ts
      - packages/unified-exec/src/unescape.ts
      - packages/yarp/index.ts
  dependency_boundaries:
    - from: packages/agents
      allow:
        - packages/agents
    - from: packages/turn-fold
      allow:
        - packages/turn-fold
    - from: packages/live-stats
      allow:
        - packages/live-stats
    - from: packages/nyan-mode
      allow:
        - packages/nyan-mode
    - from: packages/prompt-queue
      allow:
        - packages/prompt-queue
    - from: packages/restart
      allow:
        - packages/restart
    - from: packages/codex-switcher
      allow:
        - packages/codex-switcher
        - packages/pi-usage
    - from: packages/pi-codex-compaction
      allow:
        - packages/pi-codex-compaction
        - packages/codex-switcher
    - from: packages/reliable-compaction
      allow:
        - packages/reliable-compaction
        - packages/codex-switcher
    - from: packages/pi-usage
      allow:
        - packages/pi-usage
        - packages/pi-tui-kit
    - from: packages/pi-tui-kit
      allow:
        - packages/pi-tui-kit
    - from: packages/plan-checklist
      allow:
        - packages/plan-checklist
    - from: packages/unified-exec
      allow:
        - packages/unified-exec
    - from: packages/yarp
      allow:
        - packages/yarp
    - from: packages/skill-slug
      allow:
        - packages/skill-slug
