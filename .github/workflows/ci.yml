name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: KEEP_SLOPHAMMER_WORKFLOWS=1 npm run slophammer
      - run: npx --no-install slophammer-ts check .
      - name: Check @onurpi/agents package
        working-directory: packages/agents
        run: npm run check
      - name: Check @onurpi/agents package with Slophammer
        working-directory: packages/agents
        run: npm run slophammer
      - name: Check @onurpi/turn-fold package
        working-directory: packages/turn-fold
        run: npm run check
      - name: Check @onurpi/turn-fold package with Slophammer
        working-directory: packages/turn-fold
        run: npm run slophammer
      - name: Check @onurpi/goal package
        working-directory: packages/goal
        run: npm run check
      - name: Check @onurpi/goal package with Slophammer
        working-directory: packages/goal
        run: npm run slophammer
      - name: Check @onurpi/loop-guard package
        working-directory: packages/loop-guard
        run: npm run check
      - name: Check @onurpi/loop-guard package with Slophammer
        working-directory: packages/loop-guard
        run: npm run slophammer
      - name: Check @onurpi/live-stats package
        working-directory: packages/live-stats
        run: npm run check
      - name: Check @onurpi/live-stats package with Slophammer
        working-directory: packages/live-stats
        run: npm run slophammer
      - name: Check @onurpi/skill-slug package
        working-directory: packages/skill-slug
        run: npm run check
      - name: Check @onurpi/skill-slug package with Slophammer
        working-directory: packages/skill-slug
        run: npm run slophammer
      - name: Check @onurpi/codex-switcher package
        working-directory: packages/codex-switcher
        run: npm run check
      - name: Check @onurpi/codex-switcher package with Slophammer
        working-directory: packages/codex-switcher
        run: npm run slophammer
      - name: Check @onurpi/nyan-mode package
        working-directory: packages/nyan-mode
        run: npm run check
      - name: Check @onurpi/nyan-mode package with Slophammer
        working-directory: packages/nyan-mode
        run: npm run slophammer
      - name: Check @onurpi/prompt-queue package
        working-directory: packages/prompt-queue
        run: npm run check
      - name: Check @onurpi/prompt-queue package with Slophammer
        working-directory: packages/prompt-queue
        run: npm run slophammer
      - name: Check @onurpi/reliable-compaction package
        working-directory: packages/reliable-compaction
        run: npm run check
      - name: Check @onurpi/reliable-compaction package with Slophammer
        working-directory: packages/reliable-compaction
        run: npm run slophammer
      - name: Check @onurpi/infinite-retry package
        working-directory: packages/infinite-retry
        run: npm run check
      - name: Check @onurpi/infinite-retry package with Slophammer
        working-directory: packages/infinite-retry
        run: npm run slophammer
      - name: Check @onurpi/onur-openclaw-maintainer package
        working-directory: packages/onur-openclaw-maintainer
        run: npm run check
      - name: Check @onurpi/onur-openclaw-maintainer package with Slophammer
        working-directory: packages/onur-openclaw-maintainer
        run: npm run slophammer
      - name: Check @onurpi/pi-tui-kit package
        working-directory: packages/pi-tui-kit
        run: npm run check
      - name: Check @onurpi/pi-tui-kit package with Slophammer
        working-directory: packages/pi-tui-kit
        run: npm run slophammer
      - name: Check @onurpi/pi-usage package
        working-directory: packages/pi-usage
        run: npm run check
      - name: Check @onurpi/pi-usage package with Slophammer
        working-directory: packages/pi-usage
        run: npm run slophammer
      - name: Check @onurpi/pi-session package
        working-directory: packages/pi-session
        run: npm run check
      - name: Check @onurpi/pi-session package with Slophammer
        working-directory: packages/pi-session
        run: npm run slophammer
      - name: Check @onurpi/plan-checklist package
        working-directory: packages/plan-checklist
        run: npm run check
      - name: Check @onurpi/plan-checklist package with Slophammer
        working-directory: packages/plan-checklist
        run: npm run slophammer
      - name: Check @onurpi/unified-exec package
        working-directory: packages/unified-exec
        run: npm run check
      - name: Check @onurpi/unified-exec package with Slophammer
        working-directory: packages/unified-exec
        run: npm run slophammer
      - name: Check @onurpi/yarp package
        working-directory: packages/yarp
        run: npm run check
      - name: Check @onurpi/yarp package with Slophammer
        working-directory: packages/yarp
        run: npm run slophammer
      - name: Check external extension wrappers
        run: |
          for package in demo-mode huggingface-oauth pi-must-win regrafter-driver workflows; do
            npm run check --workspace "@onurpi/$package"
          done
      - name: Check external extension wrappers with Slophammer
        run: |
          for package in demo-mode huggingface-oauth pi-must-win regrafter-driver workflows; do
            npm run slophammer --workspace "@onurpi/$package"
          done
  unified-exec-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck @onurpi/unified-exec
        working-directory: packages/unified-exec
        run: npm run typecheck
      - name: Test @onurpi/unified-exec with PTY
        working-directory: packages/unified-exec
        env:
          EXPECT_PTY: "1"
        run: npm test

  mutation:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run mutate
      - name: Mutate @onurpi/turn-fold package
        working-directory: packages/turn-fold
        run: npm run mutate
      - name: Mutate @onurpi/goal package
        working-directory: packages/goal
        run: npm run mutate
      - name: Mutate @onurpi/loop-guard package
        working-directory: packages/loop-guard
        run: npm run mutate
      - name: Mutate @onurpi/live-stats package
        working-directory: packages/live-stats
        run: npm run mutate
      - name: Mutate @onurpi/skill-slug package
        working-directory: packages/skill-slug
        run: npm run mutate
      - name: Mutate @onurpi/nyan-mode package
        working-directory: packages/nyan-mode
        run: npm run mutate
      - name: Mutate @onurpi/prompt-queue package
        working-directory: packages/prompt-queue
        run: npm run mutate
      - name: Mutate @onurpi/codex-switcher package
        working-directory: packages/codex-switcher
        run: npm run mutate
      - name: Mutate @onurpi/reliable-compaction package
        working-directory: packages/reliable-compaction
        run: npm run mutate
      - name: Mutate @onurpi/pi-tui-kit package
        working-directory: packages/pi-tui-kit
        run: npm run mutate
      - name: Mutate @onurpi/pi-usage package
        working-directory: packages/pi-usage
        run: npm run mutate
      - name: Mutate @onurpi/plan-checklist package
        working-directory: packages/plan-checklist
        run: npm run mutate
      - name: Mutate @onurpi/unified-exec package
        working-directory: packages/unified-exec
        run: npm run mutate
      - name: Mutate @onurpi/yarp package
        working-directory: packages/yarp
        run: npm run mutate
