# Sandbox policy for the agent worker. The attached providers add the Discord and ChatGPT
# endpoints. Everything else is denied; the owner approves more hosts with `openshell policy update`.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /app, /sandbox/config, /sandbox/pi-agent]
  read_write: [/sandbox/work, /tmp, /home/agent]
network_policies:
  npm_registry:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/local/bin/node
  # Hosts the scheduled jobs in the inbox fetch: the LocalLLaMA radar reads Reddit listings and
  # primary artifacts, the model-release watch reads Hugging Face and GitHub, and the ACP draft
  # tracker reads the protocol site and GitHub. Reads only; writes go through the GitHub provider.
  # The owner's site is readable directly. Free web browsing goes through the public reader
  # r.jina.ai, which turns any page (including a Bing results page, for search) into markdown;
  # direct access to other hosts stays denied.
  # The host's general transcription service on the Tailscale IP: the worker POSTs voice
  # notes to it when stt.url is set, and routes Discord REST calls through the discord relay
  # (the relay adds the bot token that the L7 body handling would otherwise eat).
  stt_service:
    endpoints:
      - host: 100.119.251.79
        port: 8770
        protocol: rest
        access: read-write
        enforcement: enforce
      - host: 100.119.251.79
        port: 8771
        protocol: rest
        access: read-write
        enforcement: enforce
    binaries:
      - path: /usr/local/bin/node
  web_reads:
    endpoints:
      - host: r.jina.ai
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: solmaz.io
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: www.reddit.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: huggingface.co
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: hf.co
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: github.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: arxiv.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
      - host: agentclientprotocol.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/bin/curl
      - path: /usr/bin/git
      - path: /usr/local/bin/node
