# ChatGPT subscription login for the agent worker's openai-codex model. The gateway keeps the
# refresh token and refreshes the access token; the sandbox sees only placeholders.
#   openshell profile import -f chatgpt-codex.yaml
id: chatgpt-codex
display_name: ChatGPT Codex subscription
description: Codex OAuth login, refreshed by the gateway
category: agent
inference_capable: true
credentials:
  - name: access_token
    description: Codex OAuth access token
    env_vars: [CODEX_AUTH_ACCESS_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://auth.openai.com/oauth/token
      refresh_before: "600s"
      material:
        - name: client_id
          description: Codex OAuth client id
          required: true
        - name: refresh_token
          description: Codex OAuth refresh token
          required: true
          secret: true
  - name: account_id
    description: ChatGPT account id, sent in the chatgpt-account-id header
    env_vars: [CODEX_AUTH_ACCOUNT_ID]
    required: true
endpoints:
  - host: chatgpt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/node]
