# A narrow GitHub token for the agent worker: clone, fetch, push, issues, and pull requests, with
# repository administration denied. Use a fine-grained token limited to the agent's repositories.
# Pushes also wait for the owner's approval card inside the worker.
#   openshell profile import -f agent-github.yaml
id: agent-github
display_name: GitHub for the agent worker
description: Narrow GitHub token; repository administration stays denied
category: source_control
credentials:
  - name: api_token
    description: Fine-grained GitHub token
    env_vars: [GITHUB_TOKEN, GH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: api.github.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
    deny_rules:
      - { method: "*", path: "/repos/*/*/hooks/**" }
      - { method: "*", path: "/repos/*/*/collaborators/**" }
      - { method: "*", path: "/repos/*/*/keys/**" }
      - { method: "*", path: "/repos/*/*/actions/secrets/**" }
      - { method: "*", path: "/repos/*/*/rulesets/**" }
      - { method: "*", path: "/repos/*/*/branches/*/protection/**" }
      - { method: DELETE, path: "/repos/*/*" }
      - { method: "*", path: "/orgs/**" }
      - { method: "*", path: "/user/keys/**" }
  - host: api.github.com
    port: 443
    path: /graphql
    protocol: graphql
    access: read-write
    enforcement: enforce
  - host: github.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: { method: GET, path: "**" }
      - allow: { method: HEAD, path: "**" }
      - allow: { method: OPTIONS, path: "**" }
      - allow: { method: POST, path: "/**/git-upload-pack" }
      - allow: { method: POST, path: "/**/git-receive-pack" }
binaries: [/usr/bin/gh, /usr/bin/git]
