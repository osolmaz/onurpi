typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - "**/*.test.ts"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - codex-compaction.ts
      - config.ts
      - native-checkpoint.ts
      - remote-compaction.ts
      - responses-input.ts
  dependency_boundaries:
    - from: .
      allow: []
