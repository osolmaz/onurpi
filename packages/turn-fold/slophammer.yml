typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - "**/*.test.ts"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - compaction-visibility.ts
      - configuration.ts
      - fold-policy.ts
      - history-entry.ts
      - history-index.ts
      - history-input.ts
      - history-navigation.ts
      - history-renderer.ts
      - history-scope.ts
      - history-search.ts
      - history-viewport.ts
      - projection-plan.ts
      - restart-marker.ts
      - run-boundary.ts
      - transcript-window-adapter.ts
      - transcript-windows.ts
      - tool-padding.ts
      - turn-visibility.ts
  dependency_boundaries:
    - from: .
      allow: []
