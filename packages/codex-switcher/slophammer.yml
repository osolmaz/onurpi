typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - "**/*.test.ts"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - codex-family.ts
      - config.ts
      - native-provider.ts
      - router.ts
      - usage-client.ts
      - usage-policy.ts
  dependency_boundaries:
    - from: .
      allow:
        - ../pi-usage
