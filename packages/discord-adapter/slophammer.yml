typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - src
    exclude:
      - "**/*.test.ts"
      - pattern: "eslint.config.mjs"
        reason: Standalone package lint configuration.
      - pattern: "stryker.config.mjs"
        reason: Mutation testing configuration.
  mutation:
    targets:
      - src/access.ts
      - src/bridge.ts
      - src/chunks.ts
      - src/config.ts
  dependency_boundaries:
    - from: src
      allow:
        - src
