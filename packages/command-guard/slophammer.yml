typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - pattern: "test/**"
        reason: Test fixtures repeat command and event shapes to verify independent safety cases.
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - src/classifier.ts
      - src/path-policy.ts
      - src/policy.ts
  dependency_boundaries:
    - from: .
      allow: []
