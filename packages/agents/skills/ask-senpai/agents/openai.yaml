interface:
  display_name: "Ask Senpai"
  short_description: "Explicitly requested, costly Claude Fable or GPT-6 Astra calls"
  default_prompt: "Use Claude Fable or GPT-6 Astra only because the human explicitly requested it. These models are very expensive, so make the fewest narrowly scoped calls needed. Start the model as an interactive session in a Herdr Core terminal (hc run) that the human can watch: the claude CLI for Claude Fable, the codex CLI for GPT-6 Astra, and Cursor only when the human explicitly requests it. Do not use ACPX or a one-shot print mode. Select the model explicitly, carry messages yourself, never switch adapters or models silently, and verify the result locally."
