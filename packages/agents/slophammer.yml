typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - scripts
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - scripts/sync-skills.ts
      - scripts/sync-simpledoc-skill.ts
  dependency_boundaries:
    - from: .
      allow:
        - .
